plugins {
	id 'maven-publish'
	id 'com.github.hierynomus.license' version '0.16.1' apply false
	id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT' apply false
	id 'net.fabricmc.fabric-loom-remap' version '1.18-SNAPSHOT' apply false

	// https://github.com/ReplayMod/preprocessor
	// https://github.com/Fallen-Breath/preprocessor
	id 'com.replaymod.preprocess' version 'c5abb4fb12'

	// https://github.com/Fallen-Breath/yamlang
//	id 'me.fallenbreath.yamlang' version '1.5.0' apply false
}

preprocess {
	strictExtraMappings = false

//	def mc114  = createNode('1.14.4', 1_14_04, '')
//	def mc115  = createNode('1.15.2', 1_15_02, '')
//	def mc116  = createNode('1.16.5', 1_16_05, '')
//	def mc117  = createNode('1.17.1', 1_17_01, '')
//	def mc118  = createNode('1.18.2', 1_18_02, '')
	def mc1192  = createNode('1.19.2', 1_19_02, '')
	def mc1193  = createNode('1.19.3', 1_19_03, '')
	def mc1194  = createNode('1.19.4', 1_19_04, '')
	def mc1201 = createNode('1.20.1', 1_20_01, '')
	def mc1202 = createNode('1.20.2', 1_20_02, '')
	def mc1204 = createNode('1.20.4', 1_20_04, '')
	def mc1206 = createNode('1.20.6', 1_20_06, '')
	def mc12101 = createNode('1.21.1', 1_21_01, '')
	def mc12103 = createNode('1.21.3', 1_21_03, '')
	def mc12104 = createNode('1.21.4', 1_21_04, '')
	def mc12105 = createNode('1.21.5', 1_21_05, '')
	def mc12108 = createNode('1.21.8', 1_21_08, '')
	def mc12110 = createNode('1.21.10', 1_21_10, '')
	def mc12111 = createNode('1.21.11', 1_21_11, '')
	def mc260102 = createNode('26.1.2', 26_01_02, '')
	def mc260200 = createNode('26.2', 26_02_00, '')
	def mc260300 = createNode('26.3', 26_03_00, '')

//	mc115 .link(mc114 , null)
//	mc115 .link(mc116 , null)
//	mc116 .link(mc117 , null)
//	mc117 .link(mc118 , null)
//	mc118 .link(mc119 , null)
	mc1192.link(mc1193, null)
	mc1193.link(mc1194, null)
	mc1194.link(mc1201, null)
	mc1201.link(mc1202, null)
	mc1202.link(mc1204, null)
	mc1204.link(mc1206, null)
	mc1206.link(mc12101, null)
	mc12101.link(mc12103, null)
	mc12103.link(mc12104, null)
	mc12104.link(mc12105, null)
	mc12105.link(mc12108, null)
	mc12108.link(mc12110, null)
	mc12110.link(mc12111, null)
	mc12111.link(mc260102, null)
	mc260102.link(mc260200, null)
	mc260200.link(mc260300, null)

	// See https://github.com/Fallen-Breath/fabric-mod-template/blob/1d72d77a1c5ce0bf060c2501270298a12adab679/build.gradle#L55-L63
	for (final def node in getNodes()) {
		findProject(node.project).ext.mcVersion = node.mcVersion
	}
}

tasks.register('buildAndGather') {
	subprojects {
		dependsOn project.tasks.named('build').get()
	}
	doFirst {
		println 'Gathering builds'
		def buildLibs = {
			p -> p.buildDir.toPath().resolve('libs')
		}
		delete fileTree(buildLibs(rootProject)) {
			include '*'
		}
		subprojects {
			copy {
				from(buildLibs(project)) {
					include '*.jar'
					exclude '*-dev.jar', '*-sources.jar', '*-shadow.jar'
				}
				into buildLibs(rootProject)
				duplicatesStrategy = DuplicatesStrategy.INCLUDE
			}
		}
	}
}
